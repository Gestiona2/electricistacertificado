# Publica el sitio en GitHub Pages.
#
# El mismo código vive en dos repositorios:
#   - espinosaceballosjhonjairo-eng/pagina-web → electricistascertificadosbogota.com (raíz)
#   - Gestiona2/electricistacertificado       → demos.emp2web.com/electricistacertificado/
#
# El destino se decide solo, comparando el repositorio donde corre el flujo.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # demo → subcarpeta de demos.emp2web.com; cliente → dominio propio en la raíz
          PUBLIC_SITE: ${{ github.repository == 'Gestiona2/electricistacertificado' && 'https://demos.emp2web.com' || 'https://electricistascertificadosbogota.com' }}
          PUBLIC_BASE: ${{ github.repository == 'Gestiona2/electricistacertificado' && '/electricistacertificado' || '/' }}
        run: npm run build

      - name: Quitar el CNAME del cliente en la demo
        if: github.repository == 'Gestiona2/electricistacertificado'
        run: rm -f dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
